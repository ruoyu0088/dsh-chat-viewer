<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Chat Viewer</title>
<link rel="stylesheet" href="/static/vendor/highlight.js/11.10.0/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/static/vendor/highlight.js/11.10.0/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/vendor/katex/0.16.11/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">DSH <span>Chat Viewer</span></div>
  <div class="meta" id="meta">加载中…</div>
  <div class="tools">
    <label class="chk" title="每 3 秒刷新一次；新提问和正在生成的回答会自动出现">
      <input type="checkbox" id="follow" checked> 跟随最新
    </label>
    <label class="chk" title="在会话列表中显示已归档的会话">
      <input type="checkbox" id="show-archived" checked> 显示归档
    </label>
    <button id="btn-refresh" class="ghost" title="立即刷新">刷新</button>
  </div>
</header>

<main>
  <!-- 1. all sessions -->
  <section class="pane" id="pane-chats">
    <button class="rail" data-pane="chats" title="展开会话列表（Ctrl+B）">
      <span class="rail-icon">»</span><span class="rail-label">会话</span>
    </button>
    <div class="pane-head">
      <div class="head-row">
        <h2>所有会话</h2>
        <button class="icon-btn collapse" data-pane="chats" title="折叠会话列表（Ctrl+B 循环：显示 → 隐藏会话 → 全部隐藏）">«</button>
      </div>
      <input type="search" id="chat-filter" placeholder="过滤标题或工作目录…">
      <div class="hint" id="chat-count"></div>
    </div>
    <ul class="list" id="chat-list"></ul>
  </section>

  <!-- 2. questions of the selected session -->
  <section class="pane" id="pane-questions">
    <button class="rail" data-pane="questions" title="展开提问列表（Ctrl+Shift+B）">
      <span class="rail-icon">»</span><span class="rail-label">提问</span>
    </button>
    <div class="pane-head">
      <div class="head-row">
        <h2 id="q-head">提问列表</h2>
        <button class="icon-btn collapse" data-pane="questions" title="折叠提问列表（Ctrl+Shift+B）">«</button>
      </div>
      <div class="searchbar">
        <input type="search" id="q-search" placeholder="搜索提问或回答…（/）">
        <select id="q-scope" title="搜索范围">
          <option value="all">提问+回答</option>
          <option value="q">只搜提问</option>
          <option value="a">只搜回答</option>
        </select>
      </div>
      <div class="searchbar">
        <label class="chk"><input type="checkbox" id="search-all-chats"> 在全部会话中搜索</label>
        <span class="hint" id="q-count"></span>
      </div>
    </div>
    <ul class="list" id="question-list"></ul>
  </section>

  <!-- 3. answer of the selected question -->
  <section class="pane" id="pane-answer">
    <div class="pane-head">
      <h2 id="a-head">回答</h2>
      <div class="searchbar" id="answer-actions">
        <button id="btn-jump-a" class="ghost" title="滚动到回答正文（跳过很长的提问和思考过程）">跳到回答</button>
        <button id="btn-copy-qa" class="ghost" title="一次复制提问和回答">复制问答</button>
        <button id="btn-copy-q" class="ghost">复制提问</button>
        <button id="btn-copy-a" class="ghost">复制回答</button>
        <button id="btn-raw" class="ghost" title="在 Markdown 渲染和原始文本之间切换">原文</button>
      </div>
    </div>
    <article id="answer-body" class="empty">
      <p>从左侧选一个会话，再选一条提问，这里显示它的回答、思考过程和工具调用。</p>
      <p class="hint">数据直接来自 <code>~/.dsh/sessions</code>，只读，不会写入或锁定 DSH 的日志。</p>
    </article>
  </section>
</main>

<script src="/static/vendor/marked/12.0.2/marked.min.js"></script>
<script src="/static/vendor/katex/0.16.11/katex.min.js"></script>
<script src="/static/vendor/highlight.js/11.10.0/hljs.min.js"></script>
<script src="/static/vendor/highlight.js/11.10.0/hljs-dos.js"></script>
<script src="/static/vendor/highlight.js/11.10.0/hljs-powershell.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
